#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.8.9"

[settings]
activate_aggressive = true
experimental = true
lockfile = true
# Use mise's embedded npm installer. Shelling out to Node's npm can trigger its
# automatic reshim wrapper before mise itself is available on the install PATH.
npm.package_manager = "auto"
system_packages.managers = ["dnf", "pacman", "brew-cask"]
task.run_auto_install = false

[tool_alias]
1password-cli = "http:1password-cli"

[tools]
# Bootstrap and shell
chezmoi = "2.73.3"
sheldon = { version = "0.8.5", os = ["linux", "macos/arm64"] }
"cargo:sheldon" = { version = "0.8.5", os = ["macos/x64"], depends = ["rust"] }
starship = "1.27.0"
gh = "2.103.3"
ghq = "1.11.2"
git-lfs = "3.8.1"
delta = { version = "0.20.1", os = ["linux", "macos/arm64"] }
"cargo:git-delta" = { version = "0.20.1", os = [
  "macos/x64",
], depends = [
  "rust",
] }

# Daily CLI tools
"cargo:eza" = { version = "0.23.5", depends = [
  "rust",
], features = [
  "vendored-libgit2",
] }
fzf = "0.74.5"
"github:sharkdp/fd" = "10.5.0"
ripgrep = "15.2.0"
bat = "0.26.1"
zoxide = "0.10.0"
jq = "1.8.2"
yq = "4.54.1"
just = "1.59.0"
"github:atuinsh/atuin" = "18.24.2"
"aqua:babarot/gomi" = "1.10.1"
btop = { version = "1.4.8", os = ["linux"] }

# Editor and source validation
neovim = "0.12.6"
tree-sitter = "0.27.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
taplo = "0.10.0"
typos = "1.51.1"
"npm:typescript" = { version = "7.0.2", depends = ["node"] }
"npm:pyright" = { version = "1.1.414", depends = ["node"] }
"npm:bash-language-server" = { version = "5.8.1", depends = ["node"] }

# Language runtimes
rust = "1.99.1"
python = "3.15.2"
node = "26.12.1"
"github:pnpm/pnpm" = "12.15.0"
uv = "0.13.5"

# Agent and application CLIs
1password-cli = { version = "2.41.1", url = 'https://cache.agilebits.com/dist/1P/op2/pkg/v{{ version }}/op_{{ os(macos="darwin") }}_{{ arch(x64="amd64") }}_v{{ version }}.zip', version_list_url = "https://mise-versions.jdx.dev/1password-cli" }
herdr = { version = "v0.9.5", os = ["linux"] }
claude = "2.1.311"
"aqua:openai/codex" = "0.166.0"
opencode = "1.19.4"
ollama = "0.40.12"
"npm:@deepseek-ai/dsh" = { version = "0.2.1-rc.2", depends = ["node"] }
"npm:@earendil-works/pi-coding-agent" = { version = "1.4.0", depends = [
  "node",
] }
"npm:ccusage" = { version = "20.0.45", depends = ["node"] }

# SKK server and dictionary builder. Keep this on the Cargo git backend on
# every platform so the service behaves identically on macOS and Linux.
"cargo:https://github.com/wachikun/yaskkserv2" = { version = "rev:08aabbc91a39c67ff2562b29f92c2a274bd0394b", depends = [
  "rust",
], install_env = { CARGO_NET_GIT_FETCH_WITH_CLI = "true", GIT_CONFIG_GLOBAL = "/dev/null" } }

[tools."http:mole"]
version = "1.65.0"
os = ["macos"]
url = "https://github.com/tw93/Mole/archive/refs/tags/V{{ version }}.tar.gz"
checksum = "sha256:4b27dae6c4ab73af65c48099d244ac7f49221c151831fb1bb0f4b66763a6e23f"
strip_components = 1
bin_path = "."
postinstall = "bash \"${DOTFILES_ROOT:-$HOME/repos/github.com/kqnade/dotfiles}/scripts/install-mole-helpers.sh\""

[tasks.apply]
description = "Apply chezmoi-managed dotfiles"
run = "bash \"${DOTFILES_ROOT:-$HOME/repos/github.com/kqnade/dotfiles}/scripts/apply.sh\""

[tasks.bootstrap]
description = "Finish idempotent machine setup after tools are installed"
run = "bash \"${DOTFILES_ROOT:-$HOME/repos/github.com/kqnade/dotfiles}/scripts/bootstrap.sh\""

[tasks.dsh-setup]
description = "Install isolated personal and work DeepSeek Harness profiles"
run = "bash \"${DOTFILES_ROOT:-$HOME/repos/github.com/kqnade/dotfiles}/scripts/configure-dsh.sh\""

[tasks.doctor]
description = "Diagnose tools, packages, dotfiles, fonts, and services"
run = "bash \"${DOTFILES_ROOT:-$HOME/repos/github.com/kqnade/dotfiles}/scripts/doctor.sh\""

[tasks.format]
description = "Format repository TOML files enforced by CI"
run = "bash \"${DOTFILES_ROOT:-$HOME/repos/github.com/kqnade/dotfiles}/scripts/format.sh\""

[tasks.pre-commit]
description = "Check staged repository TOML formatting"
run = "bash \"${DOTFILES_ROOT:-$HOME/repos/github.com/kqnade/dotfiles}/scripts/pre-commit.sh\""
