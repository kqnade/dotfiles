- insert:
    - id: dotfiles-new-relic
      name: '@dotfiles/dsh-work/new-relic'

- id: agent-default-model
  config:
    provider: ollama
    model: qwen3.8:27b-mlx

- id: llm-pi-ai
  config:
    providers:
      ollama:
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        apiKeyEnv: DSH_OLLAMA_API_KEY
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: qwen3.8:27b-mlx
            contextWindow: 32768
            maxTokens: 8192
          - id: fredrezones55/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive:Q4
            contextWindow: 32768
            maxTokens: 8192

- id: compaction-basic
  config:
    modelPolicies:
      - provider: ollama
        model: qwen3.8:27b-mlx
        headroomTokens: 2048
        maxTokens: 2048
      - provider: ollama
        model: fredrezones55/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive:Q4
        headroomTokens: 2048
        maxTokens: 2048

- id: subagent-claude-code
  config:
    permissionMode: dontAsk
