#!/usr/bin/env bash

set -euo pipefail

config=$(cat)
expression='
  .approvals_reviewer = "user" |
  .model = "gpt-5.6-sol" |
  .model_reasoning_effort = "high" |
  .agents.default_subagent_model = "gpt-5.6-luna" |
  .agents.default_subagent_reasoning_effort = "max" |
  .features.hooks = true
'

if [[ -n "${NEW_RELIC_LICENSE_KEY:-}" ]]; then
  export NEW_RELIC_LICENSE_KEY
  expression+=' |
    .otel = {
      "environment": "prod",
      "log_user_prompt": false,
      "exporter": {
        "otlp-http": {
          "endpoint": "https://otlp.nr-data.net/v1/logs",
          "protocol": "binary",
          "headers": {"api-key": strenv(NEW_RELIC_LICENSE_KEY)}
        }
      },
      "trace_exporter": {
        "otlp-http": {
          "endpoint": "https://otlp.nr-data.net/v1/traces",
          "protocol": "binary",
          "headers": {"api-key": strenv(NEW_RELIC_LICENSE_KEY)}
        }
      },
      "metrics_exporter": {
        "otlp-http": {
          "endpoint": "https://otlp.nr-data.net/v1/metrics",
          "protocol": "binary",
          "headers": {"api-key": strenv(NEW_RELIC_LICENSE_KEY)}
        }
      }
    }
  '
fi

if [[ -n "$config" ]]; then
  printf '%s\n' "$config" | yq -p toml -o toml "$expression"
else
  yq -n -p toml -o toml "$expression"
fi
